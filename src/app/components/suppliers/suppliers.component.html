<div class="product-container">
    <h1>📦 Lista de Proveedores</h1>

    <div class="actions">
        <button class="add-product-btn" (click)="addSupplier()">➕ Agregar Proveedor</button>

    </div>

    <div class="table-container">
        <table mat-table [dataSource]="dataSourceSuppliers">
              
            <!-- Position Column -->
            <ng-container matColumnDef="id">
              <th  mat-header-cell *matHeaderCellDef> No. </th>
              <td mat-cell *matCellDef="let element">{{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th  mat-header-cell *matHeaderCellDef> Nombre</th>
              <td mat-cell *matCellDef="let element">{{element.name}} </td>
            </ng-container>
        
            <ng-container matColumnDef="phone">
                <th  mat-header-cell *matHeaderCellDef> Telefono</th>
                <td mat-cell *matCellDef="let element">{{element.phone}} </td>
              </ng-container>
        
              <ng-container matColumnDef="email">
                <th  mat-header-cell *matHeaderCellDef>Correo</th>
                <td mat-cell *matCellDef="let element">{{element.email}} </td>
              </ng-container>
          

              <ng-container matColumnDef="address">
                <th  mat-header-cell *matHeaderCellDef>Direccion</th>
                <td mat-cell *matCellDef="let element">{{element.address}} </td>
              </ng-container>
          

              <ng-container matColumnDef="country">
                <th  mat-header-cell *matHeaderCellDef>País</th>
                <td mat-cell *matCellDef="let element">{{element.country}} </td>
              </ng-container>
          



            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Acciones</th>
                <td mat-cell *matCellDef="let element" >
                    <button class="edit-btn" (click)="editsupplier(element.id)" >✏️ Editar</button>
                    <button class="delete-btn" (click)="confirmDelete(element.id)">🗑️ Eliminar</button>

                </td>
              </ng-container>
            
        
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
           
          <mat-paginator [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          aria-label="Select page of periodic elements">
          </mat-paginator>

</div>
